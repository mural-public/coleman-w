services:
  postgres:
    image: postgres:16-alpine
    container_name: contractor-pay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contractor_pay
    ports:
      - "5432:5432"
    volumes:
      - contractor-pay-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  contractor-pay-pg:
